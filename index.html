<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who cites my work</title>
<link rel="alternate" type="application/atom+xml" title="New citations" href="feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f7f9;
    --ink: #17202b;
    --muted: #5e6b78;
    --rule: #d9dee4;
    --accent: #2f46c8;
    --accent-soft: #e3e7fb;
    --faint: #aeb8c4;
    --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #10151b;
      --ink: #e4e9ef;
      --muted: #93a0ae;
      --rule: #29333e;
      --accent: #93a3ff;
      --accent-soft: #1f2752;
      --faint: #4b5866;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 var(--sans);
  }
  main { max-width: 52rem; margin: 0 auto; padding: 3.5rem 1.25rem 4rem; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  header .who { margin: 0; color: var(--muted); font-weight: 500; }
  header h1 {
    margin: .1rem 0 .75rem;
    font: 500 clamp(2.4rem, 6vw, 3.6rem)/1.05 var(--serif);
    letter-spacing: -.015em;
  }
  .summary { margin: 0; max-width: 38rem; color: var(--muted); }
  .summary b { color: var(--ink); font-weight: 600; }

  /* Arrival strip: one dot per citing paper, stacked by month */
  .strip { margin: .75rem 0 .5rem; overflow-x: auto; }
  .strip-inner { display: flex; align-items: flex-end; gap: 4px; min-width: 18rem; padding: 3rem 0 1.4rem; position: relative; }
  .tip {
    position: absolute; top: 0; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); border-radius: 6px;
    padding: .3rem .6rem; font-size: .8125rem; line-height: 1.35; white-space: nowrap;
    pointer-events: none; opacity: 0; transition: opacity .12s;
  }
  .tip.show { opacity: 1; }
  .tip b { font-weight: 600; display: block; }
  @media (prefers-reduced-motion: reduce) { .tip { transition: none; } }
  .month {
    position: relative; display: flex; flex-direction: column-reverse; gap: 3px;
    flex: 1 1 0; min-height: 6px; padding: 0; border: 0; background: none; cursor: pointer;
    border-bottom: 2px solid var(--rule);
  }
  .month:hover, .month[aria-pressed="true"] { border-bottom-color: var(--accent); }
  .month[aria-disabled="true"] { cursor: default; }
  .dot { display: block; width: 100%; height: 6px; border-radius: 2px; background: var(--accent); }
  .dot.est { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .month .yr { position: absolute; top: calc(100% + .3rem); left: 0; font-size: .75rem; color: var(--muted); white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: .35rem 1.25rem; font-size: .8125rem; color: var(--muted); margin: 0 0 2rem; }
  .legend span::before { content: ""; display: inline-block; width: .7rem; height: 6px; border-radius: 2px; margin-right: .4rem; vertical-align: middle; background: var(--accent); }
  .legend .l-est::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }

  .controls {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .75rem 1rem;
    padding: 1rem 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  }
  .controls label { display: flex; flex-direction: column; gap: .25rem; font-size: .8125rem; color: var(--muted); }
  .controls input[type=search], .controls select {
    font: inherit; font-size: .9375rem; color: var(--ink); background: transparent;
    border: 1px solid var(--rule); border-radius: 6px; padding: .45rem .6rem; width: 100%; min-width: 0;
  }
  .controls .check { flex-direction: row; align-items: center; gap: .5rem; font-size: .9375rem; color: var(--ink); }
  .controls .check input { accent-color: var(--accent); width: 1rem; height: 1rem; }
  .filter-note { grid-column: 1 / -1; margin: 0; font-size: .875rem; color: var(--muted); }
  .filter-note button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }

  h2 {
    margin: 2.75rem 0 .25rem; font: 500 1.375rem/1.2 var(--serif);
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
  }
  h2 small { font: 400 .8125rem var(--sans); color: var(--muted); }
  .section-note { margin: 0 0 .5rem; font-size: .875rem; color: var(--muted); max-width: 38rem; }

  .cite { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 1rem; padding: 1.1rem 0; border-bottom: 1px solid var(--rule); }
  .when { font-size: .8125rem; color: var(--muted); padding-top: .2rem; }
  .when .new { display: block; color: var(--accent); font-weight: 600; }
  .cite h3 { margin: 0; font: 400 1.1875rem/1.3 var(--serif); }
  .cite h3 a { text-decoration: none; }
  .cite h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .cite p { margin: .2rem 0 0; font-size: .875rem; }
  .authors { color: var(--muted); }
  .authors strong { color: var(--ink); font-weight: 600; }
  .venue { color: var(--muted); font-style: italic; }
  .target { color: var(--ink); }
  .target span { display: inline-block; background: var(--accent-soft); border-radius: 4px; padding: 0 .35rem; margin: .15rem .25rem 0 0; }
  .tag { font-size: .75rem; color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 0 .3rem; margin-left: .35rem; vertical-align: 2px; }

  .empty { padding: 2rem 0; color: var(--muted); }
  footer { margin-top: 3rem; font-size: .8125rem; color: var(--muted); max-width: 38rem; }
  footer a { color: var(--accent); }

  @media (max-width: 36rem) {
    main { padding-top: 2rem; }
    .controls { grid-template-columns: 1fr; }
    .cite { grid-template-columns: 1fr; gap: .25rem; }
    .when .new { display: inline; margin-left: .4rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="who" id="who"></p>
    <h1>Who cites my work</h1>
    <p class="summary" id="summary">Loading citations…</p>
  </header>

  <div class="strip" id="strip" aria-label="Citing papers per month"></div>
  <div class="legend" id="legend" hidden>
    <span>Added since tracking began</span>
    <span class="l-est">Already citing before (placed by publication date)</span>
  </div>

  <div class="controls" id="controls" hidden>
    <label>Search titles and authors
      <input type="search" id="q" placeholder="e.g. photonic, Rosenhahn">
    </label>
    <label>Which of my papers
      <select id="paper"><option value="">All papers</option></select>
    </label>
    <label>Order
      <select id="sort">
        <option value="added">Date added</option>
        <option value="published">Publication date</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="self" checked> Include self-citations</label>
    <p class="filter-note" id="note" hidden></p>
  </div>

  <div id="list"></div>

  <footer id="footer"></footer>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = { q: "", paper: "", sort: "added", self: true, month: null };
  let data = null, paperTitles = {};

  const fmtMonth = ym => new Date(ym + "-01T00:00:00").toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  const fmtDay = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  const fmtFull = d => new Date(d.length === 10 ? d + "T00:00:00" : d).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  // OpenAlex stores year-only dates as YYYY-01-01, so show just the year for those.
  const hasDay = d => d && !/-01-01$/.test(d);
  const fmtPub = c => hasDay(c.publication_date) ? fmtFull(c.publication_date) : (c.year ? String(c.year) : "");
  const fold = s => (s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

  function el(tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid != null) n.append(kid);
    return n;
  }

  function isMe(name) {
    if (!data.self) return false;
    const parts = fold(name).match(/[a-z]+/g) || [];
    return parts.length && parts[parts.length - 1] === data.self.last && parts[0][0] === data.self.first;
  }

  function filtered() {
    const q = fold(state.q.trim());
    return data.citations.filter(c =>
      (state.self || !c.self_citation) &&
      (!state.paper || c.cites.includes(state.paper)) &&
      (!state.month || c.first_seen.slice(0, 7) === state.month) &&
      (!q || fold(c.title + " " + c.authors.join(" ") + " " + (c.venue || "")).includes(q))
    );
  }

  function renderStrip() {
    const strip = $("strip");
    strip.replaceChildren();
    const pool = data.citations.filter(c => (state.self || !c.self_citation) && (!state.paper || c.cites.includes(state.paper)));
    const byMonth = {};
    for (const c of pool) (byMonth[c.first_seen.slice(0, 7)] ||= []).push(c);
    const end = new Date(data.generated_at);
    const months = [];
    for (let i = 23; i >= 0; i--) {
      const d = new Date(end.getFullYear(), end.getMonth() - i, 1);
      months.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
    }
    const inner = el("div", { class: "strip-inner" });
    const tip = el("div", { class: "tip", "aria-hidden": "true" });
    inner.append(tip);
    const showTip = (b, ym, items) => {
      const est = items.filter(c => c.first_seen_estimated).length;
      const n = items.length;
      let line = n ? `${n} paper${n === 1 ? "" : "s"}` : "No papers";
      if (est) line += est === n ? ", already citing before tracking" : ` (${est} already citing before tracking)`;
      tip.replaceChildren(el("b", { text: fmtMonth(ym) }), line);
      tip.classList.add("show");
      const half = tip.offsetWidth / 2;
      const center = b.offsetLeft + b.offsetWidth / 2;
      tip.style.left = Math.min(Math.max(center, half), inner.scrollWidth - half) + "px";
    };
    const hideTip = () => tip.classList.remove("show");
    months.forEach((ym, i) => {
      const items = byMonth[ym] || [];
      const b = el("button", {
        class: "month", type: "button",
        "aria-pressed": String(state.month === ym),
        "aria-label": `${fmtMonth(ym)}: ${items.length} paper${items.length === 1 ? "" : "s"}`
      });
      if (!items.length) b.setAttribute("aria-disabled", "true");
      b.addEventListener("pointerenter", () => showTip(b, ym, items));
      b.addEventListener("focus", () => showTip(b, ym, items));
      b.addEventListener("pointerleave", hideTip);
      b.addEventListener("blur", hideTip);
      items.slice().sort((a, b) => a.first_seen_estimated - b.first_seen_estimated)
        .forEach(c => b.append(el("span", { class: "dot" + (c.first_seen_estimated ? " est" : "") })));
      const mon = Number(ym.slice(5));
      if (mon === 1 || (i === 0 && mon < 11)) b.append(el("span", { class: "yr", text: ym.slice(0, 4) }));
      b.addEventListener("click", () => {
        if (!items.length) return;
        state.month = state.month === ym ? null : ym;
        render();
      });
      inner.append(b);
    });
    strip.append(inner);
  }

  function citeRow(c, dateLabel) {
    const authors = c.authors.length > 8 ? [...c.authors.slice(0, 6), null] : c.authors;
    const authorLine = el("p", { class: "authors" });
    authors.forEach((a, i) => {
      if (i) authorLine.append(", ");
      if (a === null) authorLine.append(`and ${c.authors.length - 6} others`);
      else authorLine.append(isMe(a) ? el("strong", { text: a }) : a);
    });
    const title = el("h3", {}, el("a", { href: c.url || "#", text: c.title, rel: "noopener" }));
    if (c.self_citation) title.append(el("span", { class: "tag", text: "self-citation" }));
    const pub = fmtPub(c);
    const venue = [c.venue, pub && `published ${pub}`].filter(Boolean).join(", ");
    const target = el("p", { class: "target" }, "Cites ");
    c.cites.forEach(pid => target.append(el("span", { text: paperTitles[pid] || pid })));
    const when = el("div", { class: "when" }, dateLabel);
    const ageDays = (new Date(data.generated_at) - new Date(c.first_seen)) / 864e5;
    if (!c.first_seen_estimated && ageDays <= 14) when.append(el("span", { class: "new", text: "new" }));
    return el("article", { class: "cite" }, when,
      el("div", {}, title, authorLine, venue ? el("p", { class: "venue", text: venue }) : null, target));
  }

  function group(list, keyFn, labelFn) {
    const groups = new Map();
    for (const c of list) { const k = keyFn(c); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); }
    return [...groups.entries()].map(([k, items]) => ({ label: labelFn(k), items }));
  }

  function section(label, items, dateFn, note) {
    const frag = document.createDocumentFragment();
    frag.append(el("h2", {}, label, el("small", { text: `${items.length} paper${items.length === 1 ? "" : "s"}` })));
    if (note) frag.append(el("p", { class: "section-note", text: note }));
    items.forEach(c => frag.append(citeRow(c, dateFn(c))));
    return frag;
  }

  function renderList() {
    const list = $("list");
    list.replaceChildren();
    const items = filtered();
    if (!items.length) {
      list.append(el("p", { class: "empty", text: "No citing papers match these filters." }));
      return;
    }
    const pubKey = c => c.publication_date || (c.year ? `${c.year}-01-01` : "0000");
    if (state.sort === "published") {
      items.sort((a, b) => pubKey(b).localeCompare(pubKey(a)));
      group(items, c => c.year || "Unknown year", k => String(k))
        .forEach(g => list.append(section(g.label, g.items, c => hasDay(c.publication_date) ? fmtDay(c.publication_date) : "")));
      return;
    }
    const tracked = items.filter(c => !c.first_seen_estimated).sort((a, b) => b.first_seen.localeCompare(a.first_seen));
    const before = items.filter(c => c.first_seen_estimated).sort((a, b) => pubKey(b).localeCompare(pubKey(a)));
    group(tracked, c => c.first_seen.slice(0, 7), fmtMonth)
      .forEach(g => list.append(section(g.label, g.items, c => fmtDay(c.first_seen))));
    if (before.length) {
      list.append(section("Already citing when tracking began", before,
        c => c.year ? String(c.year) : "",
        `These were found on the first run (${fmtFull(data.tracking_since)}), so their date added is unknown. They are ordered by publication date.`));
    }
  }

  function renderNote() {
    const note = $("note");
    note.replaceChildren();
    if (!state.month) { note.hidden = true; return; }
    const btn = el("button", { type: "button", text: "Show all months" });
    btn.addEventListener("click", () => { state.month = null; render(); });
    note.append(`Showing ${fmtMonth(state.month)} only. `, btn);
    note.hidden = false;
  }

  function render() { renderStrip(); renderNote(); renderList(); }

  function init(d) {
    data = d;
    const me = d.self_name || {};
    data.self = me.last ? { first: fold(me.first)[0] || "", last: fold(me.last) } : null;
    paperTitles = Object.fromEntries(d.papers.map(p => [p.id, p.title]));
    $("who").textContent = d.name || "";
    if (d.name) document.title = `Who cites ${d.name}`;

    const cited = d.papers.filter(p => p.citation_count > 0).length;
    const summary = $("summary");
    summary.replaceChildren(
      el("b", { text: String(d.citations.length) }), ` paper${d.citations.length === 1 ? "" : "s"} cite `,
      el("b", { text: String(cited) }), ` of my ${d.papers.length} papers. Updated ${fmtFull(d.generated_at)}.`
    );

    const sel = $("paper");
    d.papers.filter(p => p.citation_count > 0)
      .sort((a, b) => b.citation_count - a.citation_count)
      .forEach(p => sel.append(el("option", { value: p.id, text: `${p.title} (${p.citation_count})` })));

    $("q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
    sel.addEventListener("change", e => { state.paper = e.target.value; render(); });
    $("sort").addEventListener("change", e => { state.sort = e.target.value; renderList(); });
    $("self").addEventListener("change", e => { state.self = e.target.checked; render(); });
    $("controls").hidden = false;
    $("legend").hidden = false;

    const footer = $("footer");
    footer.append("Data from ", el("a", { href: "https://openalex.org", text: "OpenAlex" }),
      ", so counts can differ from Google Scholar. Dates added are the first weekly check that found each paper. ",
      el("a", { href: "feed.xml", text: "Subscribe to new citations (Atom feed)" }), ".");
    if (d.scholar_url) footer.append(" ", el("a", { href: d.scholar_url, text: "Google Scholar profile" }), ".");
    render();
  }

  fetch("citations.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(init)
    .catch(() => {
      $("summary").textContent = "citations.json could not be loaded. Run the “Update citations” workflow once, or, when opening this file locally, serve the folder with: python -m http.server";
    });
})();
</script>
</body>
</html>
